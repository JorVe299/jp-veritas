<html lang="en">

    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0D0C0B" />

    <!-- Schriften liegen selbst im Projekt (public/fonts) und werden in
         index.css per @font-face eingebunden. Das Panel muss auch in einem
         LAN ohne Internetzugang mit dem richtigen Gesicht starten. -->

      rel="preload"
      href="/fonts/archivo-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/spline-sans-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
