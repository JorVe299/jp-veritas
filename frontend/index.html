<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0D0C0B" />
    <meta
      name="description"
      content="Veritas - manage FiveM player records, online or offline: jobs, ranks and balances."
    />

    <!-- Our own mark instead of the Vite logo: a tile with a V cut out. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cmask id='m'%3E%3Crect x='4' y='5' width='22' height='24' rx='3.5' fill='%23fff'/%3E%3Cpath d='M9.5 9 15 21.5 20.5 9' fill='none' stroke='%23000' stroke-width='4.2'/%3E%3C/mask%3E%3Crect x='4' y='5' width='22' height='24' rx='3.5' fill='%23EDE9E1' mask='url(%23m)'/%3E%3Cpath d='M20.5 9 24.8 0.9' stroke='%23EDE9E1' stroke-width='4.2'/%3E%3C/svg%3E"
    />

    <!-- The fonts live in the project itself (public/fonts) and are
         included in index.css via @font-face. The panel has to start with
         the right typeface even on a LAN without internet access. -->
    <link
      rel="preload"
      href="/fonts/archivo-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/spline-sans-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>Veritas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
